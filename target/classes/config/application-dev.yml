# Configure ports
server:
  port: 9101
  servlet:
    #    context-path: /api
    application-display-name: demo

spring:
    application:
        name: demo
    profiles:
      active: dev
    # Configure the data source
    datasource:
      url: jdbc:mysql://localhost:3307/demo?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF8&zeroDateTimeBehavior=convertToNull&useSSL=false # In the higher version, MySQL needs to specify whether to use SSL connection, and if it is solved, add &useSSL=false
      name: demo
      username: root
      password: password
      # Use the druid data source
      driver-class-name: com.mysql.jdbc.Driver
      filters: stat
      maxActive: 20
      initialSize: 1
      maxWait: 60000
      minIdle: 1
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      validationQuery: select 'x'
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      poolPreparedStatements: true
      maxOpenPreparedStatements: 20

# 关闭安全验证
management:
  security:
    enabled: false

# mybatis-plus相关配置
mybatis-plus:
  # xml扫描，多个目录用逗号或者分号分隔（告诉 Mapper 所对应的 XML 文件位置）
  mapper-locations: classpath:**/*Mapper.xml
  # 以下配置均有默认值,可以不设置
  global-config:
    #主键类型  0:"数据库ID自增", 1:"用户输入ID",2:"全局唯一ID (数字类型唯一ID)", 3:"全局唯一ID UUID";
    id-type: 0
    #字段策略 0:"忽略判断",1:"非 NULL 判断"),2:"非空判断"
    field-strategy: 2
    #驼峰下划线转换
    db-column-underline: true
    #刷新mapper 调试神器
    refresh-mapper: false
    #数据库大写下划线转换
    #capital-mode: true
    #序列接口实现类配置
    #key-generator: com.baomidou.springboot.xxx
    #逻辑删除配置
    #logic-delete-value: 0 # 逻辑已删除值(默认为 1)
    #logic-not-delete-value: 1 # 逻辑未删除值(默认为 0)
    #自定义填充策略接口实现
#    meta-object-handler: com.zhengqing.config.MyMetaObjectHandler
    #自定义SQL注入器
    #sql-injector: com.baomidou.springboot.xxx
  configuration:
    # Whether to enable automatic camel case naming rule mapping: similar mapping from database column names to Java attribute camel case naming
    map-underscore-to-camel-case: true
    cache-enabled: false
    # If the query result contains a column with a null value, MyBatis will not map this field when mapping.
#    call-setters-on-nulls: true
    # This configuration will print out the executed SQL and can be used during development or testing.
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    #Solve the problem that Oracle cannot convert the error when the updated data is null. This situation does not occur with MySQL.
    jdbc-type-for-null: 'null'

zhengqing:
  swagger:
    title: 测试项目demo接口文档
    description: 测试项目demo接口文档
    version: 1.0.0
    termsOfServiceUrl:
    contactName:
    contactUrl:
    contactEmail:
    license:
    licenseUrl:
  #Security certification
  auth:
    #Token expiration time (minutes)
    tokenExpireTime: 60
    # The user chooses to save the login status corresponding to the token expiration time (days)
    saveLoginTime: 7
    # Limit the number of user login errors (times)
    loginTimeLimit: 10
    # How many minutes will it take to continue logging in after the number of errors exceeds the number (minutes)
    loginAfterTime: 10
    ignoreUrls:
      - /login
      - /api/system/user/getCurrentUserInfo
      - /index
      - /logout
      - /swagger-ui.html
#      - /swagger-resources/**
      - /swagger-resources/configuration/ui
      - /swagger-resources
      - /v2/api-docs
      - /swagger-resources/configuration/security
#      - /swagger/**
#      - /**/v2/api-docs
      - /**/*.js
      - /**/*.css
      - /**/*.png
      - /**/*.ico
